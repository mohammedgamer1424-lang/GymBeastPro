name: Build GymBeastPro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev install-info git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev
        pip install --upgrade pip
        pip install buildozer Cython virtualenv

    - name: Initialize and Configure Buildozer
      run: |
        buildozer init
        sed -i 's/^title = .*/title = GymBeastPro/' buildozer.spec
        sed -i 's/^package.name = .*/package.name = gymbeastpro/' buildozer.spec
        sed -i 's/^package.domain = .*/package.domain = org.gym/' buildozer.spec
        sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,kv,atlas/' buildozer.spec
        sed -i 's/# android.permissions = INTERNET/android.permissions = INTERNET/' buildozer.spec
        sed -i 's/^#android.api = .*/android.api = 31/' buildozer.spec

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GymBeastPro-APK
        path: bin/*.apk
        
